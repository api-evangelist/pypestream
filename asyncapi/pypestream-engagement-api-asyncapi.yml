asyncapi: 3.0.0
info:
  title: Pypestream Engagement API WebSocket
  version: '1'
  description: >-
    Bidirectional event stream backing the Pypestream Engagement API. The client creates an
    anonymous user, opens a WebSocket, joins the chat channel `chat:{CHAT_ID}`, starts the
    engagement over REST, and waits for `chat:ready` before sending messages. A request sent before
    `chat:ready` is rejected with HTTP 428. A `new:ping` must be sent every 20 seconds or the
    connection is dropped.
  contact:
    email: support@pypestream.com
  externalDocs:
    url: https://developers.pypestream.com/reference/engagement-api-websocket
servers:
  live:
    host: engagement-api.pypestream.com
    pathname: /socket/websocket
    protocol: wss
    description: Live
  sandbox:
    host: engagement-api-sandbox.pypestream.com
    pathname: /socket/websocket
    protocol: wss
    description: Sandbox
channels:
  chat:
    address: 'chat:{CHAT_ID}'
    title: Chat channel
    description: >-
      Phoenix Channels topic joined with the access token returned by the Create User
      (anonymous_session) request. Join before starting the engagement to avoid missing the
      microapp's initial messages.
    parameters:
      CHAT_ID:
        description: The engagement ID.
    messages:
      chatStart:
        $ref: '#/components/messages/chatStart'
      chatReady:
        $ref: '#/components/messages/chatReady'
      newPing:
        $ref: '#/components/messages/newPing'
      newPong:
