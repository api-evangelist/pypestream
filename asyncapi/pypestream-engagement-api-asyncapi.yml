      msgSend:
        $ref: '#/components/messages/msgSend'
      incomingMsg:
        $ref: '#/components/messages/incomingMsg'
      incomingNotice:
        $ref: '#/components/messages/incomingNotice'
      chatEnd:
        $ref: '#/components/messages/chatEnd'
      chatSnapshot:
        $ref: '#/components/messages/chatSnapshot'
      chatSnapshotResponse:
        $ref: '#/components/messages/chatSnapshotResponse'
