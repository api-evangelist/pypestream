source: >-
  openapi/pypestream-javascript-sdk-openapi.json (published by Pypestream in its own API registry),
  https://developers.pypestream.com/reference/documentation (read 2026-08-26)
summary: >-
  Pypestream's primary integration surface is not a REST call, it is an embedded UI component: a
  JavaScript-loaded chat interface that a customer drops into a web page in popup ("window") or
  inline mode. It is documented unusually -- as an OpenAPI document whose 17 "operations" are the
  SDK's methods and event handlers rather than HTTP endpoints, a framing the spec itself flags
  ("This is a client-side SDK, not a REST API").
families:
- name: Pypestream Chat Widget
  kind: embedded chat interface
  version: '3.0.0'
  version_source: info.version of the SDK contract
  license: Proprietary (https://pypestream.com/terms)
  loader:
    type: script tag
    snippet: '<script src="https://your-pypestream-domain/config.js"></script>'
    pinned: false
    note: >-
      The documented loader path carries no version segment and the script is served from a
      per-customer Pypestream domain, so a consumer cannot pin a build. See
      packages/pypestream-packages.yml.
  global: Pypestream
  display_modes:
  - name: window
    description: Opens chat in a popup window.
  - name: inline
    description: Embeds chat directly in the webpage.
  api_surface:
