    advanced:
    - registerForEvents
  method_count: 17
  config_schema: PypestreamConfig
  backing_api: pypestream:engagement-api
  backing_note: >-
    The widget is the reference consumer of the Engagement API and its Phoenix Channels WebSocket;
    the `gateway` field on the chat:start event enumerates `pypestream_widget`.
