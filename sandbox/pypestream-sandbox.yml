no_sandbox:
- api: pypestream:analytics-api
  note: >-
    The Analytics API declares exactly one server, https://analytics.pypestream.com/ ("Production
    server US"). No sandbox host is published. The product's own concept of a "Dataset" is
    documented as typically corresponding to an environment ("Production", "Testing",
    "Development"), so isolation there is a data partition inside production rather than a separate
    environment.
- api: pypestream:javascript-sdk
  note: Documentation-only contract; no environments.
test_credentials:
  published: false
  note: >-
    No test API keys, no shared demo tenant and no published test values of any kind. Sandbox
    credentials are issued the same way live ones are -- a Conversation Manager creates a Client ID
    and Client Secret inside the Pypestream platform. Nothing is self-serve.
test_data:
  fixtures: false
  triggers: false
  time_simulation: false
  note: >-
    No fixture library, no event-trigger tooling and no test clock is documented. There is no
    documented way to force a webhook event, simulate an agent going offline, or replay a
    conversation.
