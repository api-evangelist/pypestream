published: true
model: separate sandbox hosts, not test-mode keys
detail: >-
  Pypestream ships a parallel sandbox estate addressed by hostname. There is no test-mode key
  prefix, no live/test toggle on a single host, and no hosted test data: a sandbox is a different
  environment reached at a different domain with its own credentials. Sandbox is a first-class part
  of the operational surface -- Pypestream's own status page carries a US-Sandbox component
  alongside US-Production.
