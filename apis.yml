aid: pypestream
name: Pypestream
description: >-
  Pypestream is a New York based enterprise conversational and agentic AI company, founded in 2015,
  whose platform deploys voice and chat AI agents ("Pypes" and microapps) into Fortune 500 contact
  centers across insurance, health insurance, telecom and travel. Pypestream publishes a self-serve
  developer portal at developers.pypestream.com carrying six distinct OpenAPI-described surfaces --
  a Reporting API for conversation and agent data, a Contact Center API and Middleware API for live
  agent escalation, an Engagement API with a Phoenix Channels WebSocket event stream for embedding
  chat in any channel, an Analytics API for product analytics and warehouse batch exports, and an
  OpenAPI-documented client-side JavaScript SDK for embedding the chat widget.
