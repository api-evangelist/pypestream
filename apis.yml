apis:
- aid: pypestream:reporting-api
  name: Pypestream Reporting API
  description: >-
    Programmatic access to Pypestream automation, conversation and agent data. Retrieves single and
    multiple agent records, session metadata and conversation transcripts over a bounded time window.
    Available on request on a Pype-by-Pype basis; data is retained for 30 days.
  humanURL: https://developers.pypestream.com/reference/reporting-api-overview
  baseURL: https://reporting.pypestream.com/api/v2/
  tags:
  - Reporting
  - Analytics
  - Conversations
  - Agents
  properties:
  - type: OpenAPI
    url: openapi/pypestream-reporting-api-openapi.json
  - type: Documentation
    url: https://developers.pypestream.com/reference/reporting-api-overview
  - type: Overlay
    url: overlays/pypestream-reporting-api-overlay.yaml
- aid: pypestream:contact-center-api
  name: Pypestream Contact Center API
  description: >-
    Builds integrations between Pypestream and a contact center. Escalates conversations from a Pype
    or a messaging channel to a live agent, checks agent availability and wait time, exchanges
    messages and typing indicators, and manages contact-center integration settings.
  humanURL: https://developers.pypestream.com/reference/contact-center-api-overview
  baseURL: https://middleware.pypestream.com/
  tags:
  - Contact Center
  - Escalation
  - Messaging
  - Integrations
  properties:
  - type: OpenAPI
    url: openapi/pypestream-contact-center-api-openapi.json
  - type: Documentation
    url: https://developers.pypestream.com/reference/contact-center-api-overview
  - type: Webhooks
    url: asyncapi/pypestream-contact-center-webhooks.yml
  - type: Overlay
    url: overlays/pypestream-contact-center-api-overlay.yaml
- aid: pypestream:middleware-api
  name: Pypestream Middleware API
  description: >-
    The middleware layer behind the Contact Center API, exposing Settings, Integrations and
    Conversations operations. The published contract declares an empty servers[] block; the sibling
    Contact Center API contract names middleware.pypestream.com as the host for the same operations.
  humanURL: https://developers.pypestream.com/reference/contact-center-api-overview
  baseURL: https://middleware.pypestream.com/
  tags:
  - Middleware
  - Contact Center
  - Integrations
  - Settings
  properties:
  - type: OpenAPI
    url: openapi/pypestream-middleware-api-openapi.json
  - type: Overlay
    url: overlays/pypestream-middleware-api-overlay.yaml
- aid: pypestream:engagement-api
  name: Pypestream Engagement API
  description: >-
    Lets developers build interfaces and connect messaging channels so end users can engage a
    Pypestream microapp. Creates an anonymous user session, starts and ends an engagement and sends
    messages, paired with a Phoenix Channels WebSocket for the event stream.
  humanURL: https://developers.pypestream.com/reference/engagement-overview
  baseURL: https://engagement-api.pypestream.com/
  tags:
  - Engagement
  - Messaging
  - WebSocket
  - Chat
  properties:
  - type: OpenAPI
    url: openapi/pypestream-engagement-api-openapi.json
  - type: Documentation
    url: https://developers.pypestream.com/reference/engagement-overview
  - type: AsyncAPI
    url: asyncapi/pypestream-engagement-api-asyncapi.yml
  - type: Overlay
    url: overlays/pypestream-engagement-api-overlay.yaml
- aid: pypestream:analytics-api
  name: Pypestream Analytics API
  description: >-
    Product analytics over Pypestream datasets -- events, persons, cohorts, actions, annotations,
    dashboards, insights (trend, funnel, retention, path), KPIs and property definitions -- plus
    batch exports to S3 and Snowflake with backfill, pause and unpause control.
  humanURL: https://developers.pypestream.com/reference/overview-2
  baseURL: https://analytics.pypestream.com/
  tags:
  - Analytics
  - Events
  - Insights
  - Data Export
  properties:
  - type: OpenAPI
    url: openapi/pypestream-analytics-api-openapi.json
  - type: Documentation
    url: https://developers.pypestream.com/reference/overview-2
  - type: Overlay
    url: overlays/pypestream-analytics-api-overlay.yaml
- aid: pypestream:javascript-sdk
  name: Pypestream JavaScript SDK API
  description: >-
    The client-side JavaScript SDK for embedding the Pypestream conversational AI chat interface in
    a web page, in window or inline mode. Pypestream documents the SDK's methods, configuration and
    event handlers as an OpenAPI document; the spec states it is documentation only and not a
    callable REST API, and its server entry is labelled "Documentation Only".
  humanURL: https://developers.pypestream.com/reference/documentation
  tags:
  - SDK
  - JavaScript
  - Web Components
  - Embed
  properties:
  - type: OpenAPI
    url: openapi/pypestream-javascript-sdk-openapi.json
  - type: Documentation
    url: https://developers.pypestream.com/reference/documentation
- aid: pypestream:insights-api
  name: Pypestream Insights API
  description: >-
    A single-operation contract for aggregate dashboard report data. Published in Pypestream's own
    API registry, but every servers[] entry points at an unbranded Vercel preview deployment
    (analytics-eight-eta.vercel.app) or at localhost, so no production host is stated and no
    baseURL is recorded here.
  humanURL: https://developers.pypestream.com/reference/overview
  tags:
  - Insights
  - Reporting
  properties:
  - type: OpenAPI
    url: openapi/pypestream-insights-api-openapi.json
