versioning:
  scheme: path-segment, per API, not global
  detail: >-
    Each contract versions its own paths independently and there is no company-wide version policy
    page. Reporting is at /api/v2/. Contact Center mixes v1 and v2 in one document -- integrations
    on /contactCenter/v2/, conversations and settings on /contactCenter/v1/. Engagement is at
    /messaging/v1/ and its overview text calls itself "Version: 1". Analytics is unversioned in the
    path (/api/...) and carries info.version 1.0.0. The JavaScript SDK contract declares
    info.version 3.0.0.
  header_versioning: false
  version_policy_page: null
deprecation:
  policy_published: false
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  deprecated_operations: []
  note: >-
    No deprecation or sunset policy is published, no operation in any of the six contracts carries
    `deprecated: true`, and no Sunset or Deprecation response header is documented. There is,
    however, visible drift that a policy would normally cover: the Middleware API contract duplicates
    twelve of the Contact Center API's operationIds on the same paths, and the Contact Center
    document supersedes the Middleware one for conversationHistory by moving it from
    /contactCenter/v1/ to /contactCenter/v2/ -- with no statement anywhere about which document a
    consumer should follow or when the v1 path stops working.
sla:
