defects:
- id: duplicate-registry-entries
  detail: >-
    reporting-api.json and reporting-api-1.json are byte-identical 20,408-byte documents registered
    twice under different UUIDs. Pypestream's registry therefore reports eight API definitions where
    six distinct contracts exist.
- id: insights-api-points-at-a-preview-deployment
  detail: >-
    The published Insights API contract names https://analytics-eight-eta.vercel.app/live/ and
    /sandbox/ plus two http://localhost:5000 servers. The Vercel host still resolves and answers
    (404 on /live/, probed 2026-08-26) but carries no Pypestream branding, and no pypestream.com
    host is named anywhere in the document.
- id: plaintext-scheme-in-contact-center-contract
  detail: >-
    The Contact Center API declares its servers as http://middleware.pypestream.com/ and
    http://middleware-sandbox.pypestream.com/. The host in fact 301-redirects http to https (probed
    2026-08-26), and the Reporting API overview states "The reporting API must be used using HTTPS
    protocol" -- so the published scheme is wrong in the direction that matters.
- id: reporting-api-has-no-operationids
  detail: >-
    None of the Reporting API's six operations declares an operationId, which blocks generated
    clients and tool bindings from naming them.
