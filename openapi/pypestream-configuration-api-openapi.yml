openapi: 3.2.0
info:
  title: Pypestream JavaScript SDK Configuration API
  description: Client-side JavaScript SDK for embedding conversational AI chat interfaces into web applications.
  version: 3.0.0
  contact:
    name: Pypestream Support
    url: https://support.pypestream.com
  license:
    name: Proprietary
    url: https://pypestream.com/terms
servers:
- url: https://api.pypestream.com/v3
  description: Production SDK API (Documentation Only)
security: []
tags:
- name: Configuration
  description: SDK configuration methods
paths:
  /config:
    post:
      tags:
      - Configuration
      summary: Configure SDK
      description: 'Configure the Pypestream SDK before initialization. Can be called before `boot()`.


        **JavaScript Usage:**

        ```javascript

        Pypestream.config({

        APP_ID: ''your-app-id'',

        debugMode: true,

        displayMode: ''inline''

        });

        ```'
      operationId: config
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PypestreamConfig'
            examples:
              basic:
                summary: Basic configuration
                value:
                  APP_ID: your-app-id-here
                  debugMode: false
                  displayMode: window
              inline:
                summary: Inline mode with loader
                value:
                  APP_ID: your-app-id-here
                  debugMode: true
                  displayMode: inline
                  withInlineAppLoader: true
              withMessages:
                summary: With initial messages
                value:
                  APP_ID: your-app-id-here
                  displayMode: window
                  initialMessages:
                    welcomeMessage: Hello! How can I help you?
                    showNextThinkingBubble: true
      responses:
        '200':
          description: Configuration applied successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Configuration applied
  /updateConfig:
    patch:
      tags:
      - Configuration
      summary: Update configuration dynamically
      description: 'Updates the Pypestream configuration dynamically after initialization.


        **JavaScript Usage:**

        ```javascript

        Pypestream.updatePypestreamConfig({

        debugMode: true,

        initialMessages: {

        welcomeMessage: ''Updated welcome!''

        }

        });

        ```


        **Requirements:**

        - Must call after iframe is mounted

        - Merges with existing configuration'
      operationId: updatePypestreamConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PypestreamConfig'
      responses:
        '200':
          description: Configuration updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: Cannot update configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    PypestreamConfig:
      type: object
      required:
      - APP_ID
      properties:
        APP_ID:
          type: string
          description: Your Pypestream application ID (required)
          example: your-app-id-here
        debugMode:
          type: boolean
          description: Enable debug logging in console
          default: false
          example: true
        displayMode:
          type: string
          enum:
          - window
          - inline
          description: Display mode for the chat interface
          default: window
          example: inline
        APIMode:
          type: boolean
          description: Enable API mode
          default: true
          example: true
        withInlineAppLoader:
          type: boolean
          description: Show loading animation in inline mode
          default: true
          example: true
        showSurveyForWindowMode:
          type: boolean
          description: Enable survey in window mode after chat ends
          example: false
        initialMessages:
          $ref: '#/components/schemas/InitialMessages'
    InitialMessages:
      type: object
      description: Configure initial welcome messages
      properties:
        welcomeMessage:
          type: string
          description: Custom welcome message text
          example: Hello! How can I help you today?
        showNextThinkingBubble:
          type: boolean
          description: Show thinking bubble animation
          default: true
          example: true
    Error:
      type: object
      required:
      - error
      - message
      properties:
        error:
          type: string
          description: Error type
          example: Configuration Error
        message:
          type: string
          description: Detailed error message
          example: You must provide an APP_ID string in the config object
        details:
          type: object
          description: Additional error details
          additionalProperties: true
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: 'API key for accessing Pypestream services (if applicable).

        Note: The JavaScript SDK does not require API keys for client-side usage.

        '
externalDocs:
  description: Full Pypestream Documentation
  url: https://docs.pypestream.com
